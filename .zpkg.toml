[package]
org = "shared-auth-test"
name = "upgrade-compatibility-tests"
version = "0.1.0"
description = "Forward/backward schema compatibility, migration round-trip, negotiation, snapshot replay, and destructive-change guard tests."
license = "MIT"
language = "python"

[package.repository]
vcs = "git"
url = "https://github.com/shared-auth-test/upgrade-compatibility-tests"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".venv/**", ".vendor/**", "vendor/**", "artifacts/**", "**/__pycache__/**", "**/*.pyc", ".pytest_cache/**"]

[install]
dir = ".vendor/.zed"
adapter = "none"

[scripts]
test = "PYTHONPATH=src python -m unittest discover -s tests -v && python scripts/verify_repository.py"
