name: ores-stack 307 post-merge proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-307-postmerge-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MERGE_SHA: fadc384960da70681f3074b361ced73872172482
  CURRENT_MAIN_SHA: e58e9aecf38b0955b35feb2133256fdc11a17daa
  API_DOCS_SHA: 348d67decc3618b3a3846fc88c36e77c4bb6f074
  PRIVATE_SOURCE_TOKEN: ${{ secrets.TEST_FLEET_READ_TOKEN || secrets.ORE_SOURCE_PAT || secrets.MCP_FLEET_READ_TOKEN || secrets.PRIVATE_SOURCE_TOKEN || secrets.GH_READ_TOKEN }}

jobs:
  exact-merge-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require existing private-source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_SOURCE_TOKEN"
      - name: Check out exact merged ORES Stack commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.MERGE_SHA }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source and provenance semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --check
          grep -F "rev = \"$API_DOCS_SHA\"" crates/ores-stack-core/Cargo.toml
          grep -F 'schema_version: ores_api_docs::RPC_OPERATION_CONTRACT_SCHEMA_VERSION' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -F 'http_handler: None' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -F 'let http_handler = (!projection.route_less)' crates/ores-stack-core/src/rpc_target_v3.rs
          grep -F '(None, None, Some(operation.handlers_source.clone()))' crates/ores-stack-core/src/rpc_target_v3.rs
          if grep -F 'handler: operation.handler.clone()' crates/ores-stack-core/src/rpc_http_client_lane_post.rs; then
            echo 'legacy synthetic HTTP provenance is still present' >&2
            exit 1
          fi
      - name: Configure scoped private Git dependency access
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_SOURCE_TOKEN"
          git config --global url."https://x-access-token:${PRIVATE_SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format, lint, and test merged core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p ores-stack-core --all-targets -- -D warnings
          cargo test --locked -p ores-stack-core --all-targets -- --nocapture
      - name: Prove checkout unchanged
        if: always()
        shell: bash
        run: |
          if [ -d .git ]; then
            test "$(git rev-parse HEAD)" = "$MERGE_SHA"
            git diff --exit-code
            git diff --cached --exit-code
          fi

  current-main-linux-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require existing private-source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_SOURCE_TOKEN"
      - name: Check out exact current ORES Stack main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.CURRENT_MAIN_SHA }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify provenance survived subsequent merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
          git diff --check
          grep -F "rev = \"$API_DOCS_SHA\"" crates/ores-stack-core/Cargo.toml
          grep -F 'schema_version: ores_api_docs::RPC_OPERATION_CONTRACT_SCHEMA_VERSION' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -F 'http_handler: None' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -F 'let http_handler = (!projection.route_less)' crates/ores-stack-core/src/rpc_target_v3.rs
      - name: Configure scoped private Git dependency access
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_SOURCE_TOKEN"
          git config --global url."https://x-access-token:${PRIVATE_SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Locked workspace lint and tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets -- --nocapture
      - name: Prove checkout unchanged
        if: always()
        shell: bash
        run: |
          if [ -d .git ]; then
            test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
            git diff --exit-code
            git diff --cached --exit-code
          fi

  current-main-macos-core:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Require existing private-source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_SOURCE_TOKEN"
      - name: Check out exact current ORES Stack main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.CURRENT_MAIN_SHA }}
          token: ${{ env.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Configure scoped private Git dependency access
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_SOURCE_TOKEN"
          git config --global url."https://x-access-token:${PRIVATE_SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Test core on macOS against committed lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
          cargo test --locked -p ores-stack-core --all-targets -- --nocapture
      - name: Prove checkout unchanged
        if: always()
        shell: bash
        run: |
          if [ -d .git ]; then
            test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
            git diff --exit-code
            git diff --cached --exit-code
          fi
